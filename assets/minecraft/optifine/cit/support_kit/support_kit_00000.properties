#Texture Type
type=item

#Item type
matchItems=minecraft:shears

#Replacement texture/model
texture=support_kit_00000

# Subset matching. MineZ omits the *_enabled key entirely when a module is off,
# and CIT has no negation, so this file asserts ONLY the modules that must be ON.
# A kit whose real enabled-set is S matches every rule whose required set T is a
# subset of S. weight = 10 * (|T| + 1), so the rule with the largest T wins -- and
# T subset-of S with |T| == |S| forces T == S, so the exact rule always wins uniquely.
weight=10

#Rules
components.minecraft:custom_data.PublicBukkitValues.minez:legendary_id=support_kit
